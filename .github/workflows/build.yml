name: Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Install D3DX9 via NuGet
        shell: powershell
        run: |
          $nuget = "$env:RUNNER_TEMP\nuget.exe"

          Invoke-WebRequest `
            -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" `
            -OutFile $nuget

          & $nuget install Microsoft.DXSDK.D3DX `
            -Version 9.29.952.8 `
            -OutputDirectory "$env:RUNNER_TEMP\nuget"

          Write-Host "Installed packages:"
          Get-ChildItem "$env:RUNNER_TEMP\nuget" -Recurse |
            Select-Object FullName

      - name: Retarget project to VS2022
        shell: powershell
        run: |
          $file = "cheat1\cheat1.vcxproj"

          (Get-Content $file -Raw) `
            -replace '<PlatformToolset>v141</PlatformToolset>', '<PlatformToolset>v143</PlatformToolset>' |
            Set-Content $file

      - name: Locate D3DX9
        shell: powershell
        run: |
          $header = Get-ChildItem `
            "$env:RUNNER_TEMP\nuget" `
            -Recurse `
            -Filter d3dx9.h `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $header) {
            throw "d3dx9.h was not found."
          }

          Write-Host "Found d3dx9.h:"
          Write-Host $header.FullName

            - name: Build
        shell: powershell
        run: |
          $dx = "$env:RUNNER_TEMP\nuget\Microsoft.DXSDK.D3DX.9.29.952.8\build\native"

          $include = "$dx\include"
          $lib = "$dx\release\lib\x86"

          Write-Host "D3DX include: $include"
          Write-Host "D3DX library: $lib"

          if (-not (Test-Path "$include\d3dx9.h")) {
            throw "d3dx9.h not found"
          }

          if (-not (Test-Path "$lib\d3dx9.lib")) {
            throw "d3dx9.lib not found"
          }

          msbuild SpyExternalMultihax.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform=x86 `
            /p:AdditionalIncludeDirectories="$include" `
            /p:AdditionalLibraryDirectories="$lib"

      - name: Find executables
        shell: powershell
        run: |
          Get-ChildItem -Path . -Recurse -Filter *.exe |
            Select-Object FullName

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SpyExternalMultihax-x86
          path: |
            **/*.exe
