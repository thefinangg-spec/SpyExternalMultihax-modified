name: Build SpyExternalMultihax

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install D3DX9
        shell: powershell
        run: |
          $nuget = "$env:RUNNER_TEMP\nuget.exe"

          Invoke-WebRequest `
            -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" `
            -OutFile $nuget

          & $nuget install Microsoft.DXSDK.D3DX `
            -Version 9.29.952.8 `
            -OutputDirectory "$env:RUNNER_TEMP\nuget"

      - name: Configure project
        shell: powershell
        run: |
          $file = "cheat1\cheat1.vcxproj"

          if (-not (Test-Path $file)) {
            throw "Project file not found: $file"
          }

          $dx = "$env:RUNNER_TEMP\nuget\Microsoft.DXSDK.D3DX.9.29.952.8\build\native"

          $include = "$dx\include"
          $lib = "$dx\release\lib\x86"

          if (-not (Test-Path "$include\d3dx9.h")) {
            throw "d3dx9.h not found: $include"
          }

          if (-not (Test-Path "$lib\d3dx9.lib")) {
            throw "d3dx9.lib not found: $lib"
          }

          Write-Host "D3DX include: $include"
          Write-Host "D3DX library: $lib"

          # Read project
          $content = Get-Content $file -Raw

          # VS2017 -> current Visual Studio toolset
          $content = $content -replace `
            '<PlatformToolset>v141</PlatformToolset>', `
            '<PlatformToolset>v143</PlatformToolset>'

          # Replace old Windows SDK version
          $sdkRoot = "C:\Program Files (x86)\Windows Kits\10\Include"

          $sdk = Get-ChildItem $sdkRoot -Directory |
            Where-Object {
              Test-Path "$($_.FullName)\um\windows.h"
            } |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if ($null -eq $sdk) {
            throw "No Windows SDK found."
          }

          $sdkVersion = $sdk.Name

          Write-Host "Windows SDK: $sdkVersion"

          $content = $content -replace `
            '<WindowsTargetPlatformVersion>[^<]+</WindowsTargetPlatformVersion>', `
            "<WindowsTargetPlatformVersion>$sdkVersion</WindowsTargetPlatformVersion>"

          # ----------------------------------------------------------
          # Add D3DX include/library directories directly to project.
          # ----------------------------------------------------------

          $escapedInclude = [System.Security.SecurityElement]::Escape($include)
          $escapedLib = [System.Security.SecurityElement]::Escape($lib)

          # Add include path to every ClCompile ItemDefinitionGroup.
          $content = $content -replace `
            '(<ClCompile>)', `
            "`$1`r`n      <AdditionalIncludeDirectories>$escapedInclude;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>"

          # Add library path to every Link section.
          $content = $content -replace `
            '(<Link>)', `
            "`$1`r`n      <AdditionalLibraryDirectories>$escapedLib;%(AdditionalLibraryDirectories)</AdditionalLibraryDirectories>"

          Set-Content `
            -Path $file `
            -Value $content `
            -Encoding UTF8

          Write-Host ""
          Write-Host "========== Project configuration =========="

          Select-String `
            -Path $file `
            -Pattern "PlatformToolset|WindowsTargetPlatformVersion|AdditionalIncludeDirectories|AdditionalLibraryDirectories"

          Write-Host "==========================================="

      - name: Build
        shell: powershell
        run: |
          Write-Host "Building Release x86..."

          msbuild SpyExternalMultihax.sln `
            /m `
            /p:Configuration=Release `
            /p:Platform=x86

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: Show build output
        shell: powershell
        run: |
          Write-Host "Searching for executable..."

          Get-ChildItem `
            -Path . `
            -Filter "*.exe" `
            -Recurse `
            -File |
            Where-Object {
              $_.FullName -notmatch "\\packages\\" -and
              $_.FullName -notmatch "\\obj\\"
            } |
            ForEach-Object {
              Write-Host $_.FullName
            }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SpyExternalMultihax-x86
          path: |
            cheat1\Release\*.exe
          if-no-files-found: error
