name: Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Download DirectX SDK June 2010
        shell: powershell
        run: |
          $url = "https://download.microsoft.com/download/A/E/7/AE743F1F-632B-4809-87A9-AA1BB3458E31/DXSDK_Jun10.exe"
          $installer = "$env:RUNNER_TEMP\DXSDK_Jun10.exe"

          Write-Host "Downloading DirectX SDK..."
          Invoke-WebRequest `
            -Uri $url `
            -OutFile $installer

          Write-Host "Downloaded:"
          Get-Item $installer | Select-Object FullName, Length

      - name: Extract DirectX headers and x86 libraries
        shell: powershell
        run: |
          $installer = "$env:RUNNER_TEMP\DXSDK_Jun10.exe"
          $dx = "$env:RUNNER_TEMP\DXSDK"

          New-Item -ItemType Directory -Force -Path $dx | Out-Null

          Write-Host "Extracting DirectX SDK..."

          7z x $installer "DXSDK/Include/*" "-o$dx" -y
          7z x $installer "DXSDK/Lib/x86/*" "-o$dx" -y

          Write-Host "Checking d3dx9.h..."
          if (-not (Test-Path "$dx\DXSDK\Include\d3dx9.h")) {
            throw "d3dx9.h was not extracted."
          }

          Write-Host "Checking d3dx9.lib..."
          if (-not (Test-Path "$dx\DXSDK\Lib\x86\d3dx9.lib")) {
            throw "d3dx9.lib was not extracted."
          }

          Write-Host "DirectX SDK files found successfully."

      - name: Retarget project to VS2022
        shell: powershell
        run: |
          $file = "cheat1\cheat1.vcxproj"

          (Get-Content $file -Raw) `
            -replace '<PlatformToolset>v141</PlatformToolset>', '<PlatformToolset>v143</PlatformToolset>' |
            Set-Content $file

      - name: Build
        shell: cmd
        run: |
          msbuild SpyExternalMultihax.sln ^
            /m ^
            /p:Configuration=Release ^
            /p:Platform=x86 ^
            /p:IncludePath="%RUNNER_TEMP%\DXSDK\DXSDK\Include;$(IncludePath)" ^
            /p:LibraryPath="%RUNNER_TEMP%\DXSDK\DXSDK\Lib\x86;$(LibraryPath)"

      - name: Find executables
        shell: powershell
        run: |
          Get-ChildItem -Path . -Recurse -Filter *.exe |
            Select-Object FullName

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: SpyExternalMultihax-x86
          path: |
            **/*.exe
